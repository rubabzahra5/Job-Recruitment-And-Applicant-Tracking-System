{% extends 'base.html' %}

{% block title %}Accept Recruiter Invitation - ATS{% endblock %}

{% block content %}
<div class="container px-lg-4" style="max-width: 580px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white mt-3">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-person-check-fill fs-3"></i>
            </div>
            <h3 class="fw-bold mb-1">Join {{ invitation.company_name }}</h3>
            <p class="text-muted small">You have been invited to join the hiring team as a <strong>Recruiter</strong>.</p>
        </div>

        <form method="POST" action="{{ url_for('accept_invitation', token=invitation.token) }}">
            <div class="row g-3 mb-3">
                <div class="col-12">
                    <label class="form-label fw-semibold small">Work Email</label>
                    <input type="email" class="form-control bg-light" value="{{ invitation.email }}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small">First Name</label>
                    <input type="text" name="first_name" class="form-control" placeholder="Jane" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small">Last Name</label>
                    <input type="text" name="last_name" class="form-control" placeholder="Doe" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold small">Choose Username <span class="text-danger">*</span></label>
                    <input type="text" name="username" class="form-control" placeholder="jane_recruiter" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold small">Create Password <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" placeholder="Enter secure password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-check2-circle me-1"></i> Accept Invitation & Access Workspace
            </button>
        </form>
    </div>
</div>
{% endblock %}
